<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ParkReserva</title>
   <link rel="stylesheet" href="../css/cadastrofuncionario.css">
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    >
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

     <header class="senac-header d align-items-center px-4 py-3 shadow-sm">
        <img src="../assets/logo_pkg/06_monocromatica_dourada/06_monocromatica_dourada_medio_1000.webp" width="70" height="70" class="logo-esqueci me-2" alt="Logo Senac">
        <span class="text-white fw-semibold fs-4 ms-2">Estacionamento - Parkschool</span>
    </header>
    <!-- CONTAINER PRINCIPAL -->
    <div class="container-fluid vh-75 d-flex justify-content-center align-items-center">
        <!-- CARD -->
        <div
            class="card shadow-lg p-4 rounded mt-5 "
            
        >
            <!-- TÍTULO -->
            <h2 class="text-center fw-bold mb-4">
                <i class="fa-solid fa-user-plus me-2"></i>
                Crie sua Conta
            </h2>

            <!-- FORMULÁRIO -->
            <form id="formCadastroFuncionario">
                <!-- NOME -->
                <div class="mb-3">
                    <label for="nomeFuncionario" class="form-label fw-bold">
                        Nome Completo
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input
                            type="text"
                            class="form-control"
                            id="nomeFuncionario"
                            name="nomeFuncionario"
                            placeholder="Digite seu nome completo"
                            required
                        >
                    </div>
                </div>

                <!-- CHAPA -->
                <div class="mb-3">
                    <label for="chapaFuncionario" class="form-label fw-bold">
                        ID Funcionário
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-id-card"></i>
                        </span>
                        <input
                            type="text"
                            class="form-control"
                            id="chapaFuncionario"
                            name="chapaFuncionario"
                            placeholder="Chapa de funcionário (ex: 123456-2)"
                            required
                        >
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="emailFuncionario" class="form-label fw-bold">
                        E-mail
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input
                            type="email"
                            class="form-control"
                            id="emailFuncionario"
                            name="emailFuncionario"
                            placeholder="testesenac@exemplo.com"
                            required
                        >
                    </div>
                </div>

                <!-- SENHA -->
                <div class="mb-3">
                    <label for="senhaFuncionario" class="form-label fw-bold">
                        Crie uma Senha
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control"
                            id="senhaFuncionario"
                            name="senhaFuncionario"
                            placeholder="Crie uma senha"
                            required
                        >
                        <span class="input-group-text">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="mb-4">
                    <label for="confirmarSenhaFuncionario" class="form-label fw-bold">
                        Confirme a Senha
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmarSenhaFuncionario"
                            name="confirmarSenhaFuncionario"
                            placeholder="Confirme a senha"
                            required
                        >
                        <span class="input-group-text">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>

                <!-- TERMOS -->
                <div class="form-check mt-3 mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="checkTermos"
                        name="checkTermos"
                        required
                    >
                    <label class="form-check-label" for="checkTermos">
                        <i class="fa-solid fa-shield-halved me-1"></i>
                        Li e aceito os
                        <a href="#" data-bs-toggle="modal" data-bs-target="#modalTermos">
                            Termos de Uso e a Política de Privacidade
                        </a>
                    </label>
                </div>

                <!-- BOTÃO CRIAR CONTA -->
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnCriarConta">
                    <i class="fa-solid fa-user-plus me-2"></i>
                    Criar Conta
                </button>

                <!-- VOLTAR PARA LOGIN -->
                <a href="loguinusuario.html" class="btn btn-outline-secondary w-100 mt-2" id="btnVoltarLogin">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Voltar para o Login
                </a>
            </form>
        </div>
    </div>

    <!-- MODAL DOS TERMOS -->
    <div class="modal fade" id="modalTermos" tabindex="-1" aria-labelledby="modalTermosLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTermosLabel">
                        <i class="fa-solid fa-file-contract me-2"></i>
                        Termos de Uso e Privacidade
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <!-- CONTEÚDO -->
                <div class="modal-body p-0">
                    <iframe
                        src="termos.html"
                        id="iframeTermos"
                        style="width: 100%; height: 600px; border: none;"
                        title="Termos de Uso e Privacidade"
                    ></iframe>
                </div>
                <!-- RODAPÉ -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnFecharTermos" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark me-1"></i>
                        Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYJYlzcLA8Nl-+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>
</body>

</html>
