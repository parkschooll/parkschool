<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha - Sistema de Vagas Senac</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column vh-100 main-bg">

    <header class="senac-header d-flex align-items-center px-4 py-3 shadow-sm">
        <img src="../assets/logo_pkg/06_monocromatica_dourada/06_monocromatica_dourada_medio_1000.webp" width="70" height="70" class="logo-esqueci me-2" alt="Logo Senac">
        <span class="text-white fw-semibold fs-4 ms-2">Estacionamento - Parkschool</span>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="esqueci-senha-wrapper bg-surface shadow rounded p-4 p-md-5 w-100 mx-auto" style="max-width: 420px;">

            <div id="step-request">
                <div class="icon-circle mb-3 mx-auto text-primary d-flex align-items-center justify-content-center rounded-circle" style="width: 56px; height: 56px; background-color: #EAF0FB; flex-shrink: 0;">
                    <i class="fa-solid fa-key fs-4"></i>
                </div>
                <h2 class="fw-bold mb-2 text-center text-primary-custom fs-4">Esqueci minha senha</h2>
                <p class="ds-text-secondary text-center mb-4" style="font-size: 14px;">Escolha como prefere receber o código para recuperar o acesso.</p>

                <div class="d-flex bg-light p-1 rounded mb-4">
                    <button class="btn flex-grow-1 tab-btn fw-medium" id="tab-email" type="button">E-mail</button>
                    <button class="btn flex-grow-1 tab-btn fw-medium text-secondary" id="tab-phone" type="button">Telefone</button>
                </div>

                <form id="request-form">
                    <div class="mb-4 form-field" id="field-email">
                        <label for="email" class="form-label fw-medium" style="font-size: 13px;">E-mail cadastrado</label>
                        <div class="input-group ds-input-group">
                            <span class="input-group-text border-end-0"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="nome@senac.br">
                        </div>
                    </div>

                    <div class="mb-4 form-field d-none" id="field-phone">
                        <label for="phone" class="form-label fw-medium" style="font-size: 13px;">Telefone cadastrado</label>
                        <div class="input-group ds-input-group">
                            <span class="input-group-text border-end-0"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" class="form-control border-start-0 ps-0" id="phone" placeholder="(00) 00000-0000" inputmode="numeric">
                        </div>
                    </div>

                    <button class="btn ds-btn-primary w-100 py-2 fw-semibold d-flex justify-content-center align-items-center gap-2" id="submit-btn" type="submit" disabled>
                        <span id="submit-label">Enviar código de recuperação</span>
                        <span class="spinner-border spinner-border-sm d-none" id="submit-spinner" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <a href="login.html" class="text-decoration-none ds-text-secondary d-flex justify-content-center align-items-center gap-2 mt-4 fw-medium hover-primary" style="font-size: 13px;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para o login
                </a>
            </div>

            <div id="step-sent" class="d-none">
                <div class="icon-circle mb-3 mx-auto text-success d-flex align-items-center justify-content-center rounded-circle" style="width: 56px; height: 56px; background-color: #ECFDF5; flex-shrink: 0;">
                    <i class="fa-solid fa-check fs-4"></i>
                </div>
                <h2 class="fw-bold mb-2 text-center text-primary-custom fs-4">Código enviado</h2>
                <p class="ds-text-secondary text-center mb-4" style="font-size: 14px;">Enviamos um código de verificação para <strong id="destination" class="text-dark"></strong>.</p>

                <div class="mb-4">
                    <label for="code" class="form-label fw-medium text-center d-block" style="font-size: 13px;">Código de verificação</label>
                    <input type="text" id="code" class="form-control code-input text-center fs-3 py-2" placeholder="000000" maxlength="6" inputmode="numeric">
                </div>

                <button class="btn ds-btn-primary w-100 py-2 fw-semibold mb-3" type="button">Confirmar código</button>
                <button class="btn btn-link text-decoration-none ds-text-primary w-100 mb-2 fw-medium" type="button" style="font-size: 13px;">Reenviar código</button>
                <button class="btn btn-link text-decoration-none ds-text-secondary w-100 d-flex justify-content-center align-items-center gap-2 fw-medium hover-primary" type="button" id="btn-back-method" style="font-size: 13px;">
                    <i class="fa-solid fa-arrow-left"></i> Escolher outro método
                </button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
    <script src="../js/esqueci-senha.js"></script>
</body>
</html>
