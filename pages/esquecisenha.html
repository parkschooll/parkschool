<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esqueci minha senha - Sistema de Vagas Senac</title>
<style>
  :root {
    --navy: #1D397D;
    --teal: #1C4966;
    --slate: #64748B;
    --gray: #B5B5B5;
    --green: #10B981;
    --green-bg: #ECFDF5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #EEF2F7 0%, #E4E9F1 55%, #E9EDF2 100%);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header svg { flex-shrink: 0; }

  header span {
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.05);
    padding: 28px 28px 24px;
  }

  .icon-circle {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #EAF0FB;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  .icon-circle.success { background: var(--green-bg); }

  h1 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 20px;
    color: var(--navy);
  }

  p.subtitle {
    margin: 0 auto 20px;
    text-align: center;
    max-width: 280px;
    color: var(--slate);
    font-size: 14px;
    line-height: 1.5;
  }

  p.subtitle strong { color: #334155; }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #F1F5F9;
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 20px;
  }

  .tab-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    background: transparent;
    padding: 8px 0;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--slate);
    cursor: pointer;
  }

  .tab-btn.active {
    background: #fff;
    color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .field {
  display: block;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.field.active {
  opacity: 1;
  max-height: 200px; /* alto o suficiente pro campo caber */
  pointer-events: auto;
}

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="tel"],
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--gray);
    border-radius: 8px;
    font-size: 14px;
    color: #1E293B;
    outline: none;
  }

  input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(29, 57, 125, 0.12);
  }

  .btn-primary {
    width: 100%;
    margin-top: 20px;
    padding: 11px 0;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 13px;
    color: var(--slate);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }

  .resend-link {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: var(--teal);
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 4px;
  }

  .code-input {
    text-align: center;
    letter-spacing: 0.5em;
    font-size: 16px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #step-sent { display: none; }
</style>
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
  <span>Sistema de Vagas — Senac</span>
</header>

<main>
  <div class="card">

    <!-- PASSO 1: pedir método -->
    <div id="step-request">
      <div class="icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D397D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>
        </svg>
      </div>
      <h1>Esqueci minha senha</h1>
      <p class="subtitle">Escolha como prefere receber o código para recuperar o acesso.</p>

      <div class="tabs">
        <button class="tab-btn active" id="tab-email" onclick="selectMethod('email')">
          E-mail
        </button>
        <button class="tab-btn" id="tab-phone" onclick="selectMethod('phone')">
          Telefone
        </button>
      </div>

      <form id="request-form" onsubmit="handleSubmit(event)">
        <div class="field active" id="field-email">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" placeholder="nome@senac.br" oninput="validate()" />
        </div>
        <div class="field" id="field-phone">
          <label for="phone">Telefone cadastrado</label>
          <input type="tel" id="phone" placeholder="(00) 00000-0000" inputmode="numeric" oninput="handlePhoneInput(event)" />
        </div>

        <button class="btn-primary" id="submit-btn" type="submit" disabled>
          <span id="submit-label">Enviar código de recuperação</span>
        </button>
      </form>

      <button class="back-link" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para o login
      </button>
    </div>

    <!-- PASSO 2: código enviado -->
    <div id="step-sent">
      <div class="icon-circle success">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1>Código enviado</h1>
      <p class="subtitle">Enviamos um código de verificação para <strong id="destination"></strong>.</p>

      <label for="code">Código de verificação</label>
      <input type="text" id="code" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric" />

      <button class="btn-primary" type="button">Confirmar código</button>

      <button class="resend-link" type="button" onclick="goBack()">Reenviar código</button>
      <button class="back-link" type="button" onclick="goBack()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Escolher outro método
      </button>
    </div>

  </div>
</main>

<script>
  let currentMethod = "email";

  function selectMethod(method) {
    currentMethod = method;
    document.getElementById("tab-email").classList.toggle("active", method === "email");
    document.getElementById("tab-phone").classList.toggle("active", method === "phone");
    document.getElementById("field-email").classList.toggle("active", method === "email");
    document.getElementById("field-phone").classList.toggle("active", method === "phone");
    validate();
  }

  function handlePhoneInput(e) {
    let digits = e.target.value.replace(/\D/g, "").slice(0, 11);
    let masked = digits;
    if (digits.length > 2 && digits.length <= 7) {
      masked = `(${digits.slice(0,2)}) ${digits.slice(2)}`;
    } else if (digits.length > 7) {
      masked = `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
    }
    e.target.value = masked;
    validate();
  }

  function validate() {
    const btn = document.getElementById("submit-btn");
    let valid = false;
    if (currentMethod === "email") {
      const val = document.getElementById("email").value;
      valid = val.includes("@") && val.split("@")[1]?.includes(".");
    } else {
      const digits = document.getElementById("phone").value.replace(/\D/g, "");
      valid = digits.length === 11;
    }
    btn.disabled = !valid;
  }

  function maskEmailForDisplay(email) {
    const [user, domain] = email.split("@");
    if (!domain) return email;
    const visible = user.slice(0, 2);
    return `${visible}${"*".repeat(Math.max(user.length - 2, 1))}@${domain}`;
  }

  function maskPhoneForDisplay(phone) {
    const digits = phone.replace(/\D/g, "");
    return `(${digits.slice(0,2)}) *****-${digits.slice(-4)}`;
  }

  function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const label = document.getElementById("submit-label");
    btn.disabled = true;
    label.innerHTML = '<span class="teste"></span> Enviando...';

    setTimeout(() => {
      const destination = currentMethod === "email"
        ? maskEmailForDisplay(document.getElementById("email").value)
        : maskPhoneForDisplay(document.getElementById("phone").value);

      document.getElementById("destination").textContent = destination;
      document.getElementById("step-request").style.display = "none";
      document.getElementById("step-sent").style.display = "block";

      // reset button for next time
      btn.disabled = false;
      label.textContent = "Enviar código de recuperação";
    }, 900);
  }

  function goBack() {
    document.getElementById("step-sent").style.display = "none";
    document.getElementById("step-request").style.display = "block";
  }
</script>

</body>
</html>
