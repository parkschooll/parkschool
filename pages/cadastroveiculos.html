<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Veículos - ParkReserva</title>
  <link rel="stylesheet" href="../css/cadastroveiculo.css">
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
    >
</head>

<body>

<header class="senac-header d-flex align-items-center px-4 py-3 shadow-sm" style="background-color: #1D397D;">
        <img src="../assets/logo_pkg/06_monocromatica_dourada/06_monocromatica_dourada_medio_1000.webp" width="70" height="70" class="logo-esqueci me-2" alt="Logo Senac">
        <span class="text-white fw-semibold fs-4 ms-2">Estacionamento - Parkschool</span>
    </header> 

  

    <!-- ÁREA PRINCIPAL -->
    <div class="container-fluid">
        <div class="row">
          

            <!-- CONTEÚDO -->
            <div class="col-10 p-4">
                <h3 class="mb-4" id="tituloCadastroVeiculo">
                    Cadastro de Veículo
                </h3>

                <!-- FORMULÁRIO -->
                <form id="formCadastroVeiculo">
                    <!-- MODELO -->
                    <div class="mb-3">
                        <label for="modeloVeiculo" class="form-label fw-semibold">
                            Modelo do carro
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="modeloVeiculo"
                            name="modeloVeiculo"
                            placeholder="Digite o modelo do carro (ex: Gol, Onix, Civic, Yamaha)"
                            required
                        >
                    </div>

                    <!-- TIPO -->
                    <div class="mb-3">
                        <label for="tipoVeiculo" class="form-label fw-semibold">
                            Tipo de veículo
                        </label>
                        <select
                            class="form-select"
                            id="tipoVeiculo"
                            name="tipoVeiculo"
                            required
                        >
                            <option value="">
                                Selecione o tipo de veículo
                            </option>
                            <option value="carro">
                                Carro
                            </option>
                            <option value="moto">
                                Moto
                            </option>
                        </select>
                    </div>

                    <!-- ANO DO VEÍCULO (Corrigido para fora do select) -->
                    <div class="mb-3">
                        <label for="anoVeiculo" class="form-label fw-semibold">Ano do veículo</label>
                        <input type="number" class="form-control" id="anoVeiculo" name="anoVeiculo" placeholder="2020, 2026" required>
                    </div>

                    <!-- COR -->
                    <div class="mb-3">
                        <label for="corVeiculo" class="form-label fw-semibold">
                            Cor do carro
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="corVeiculo"
                            name="corVeiculo"
                            placeholder="Digite a cor do carro (ex: Vermelho, Azul, Prata)"
                            required
                        >
                    </div>

                    <!-- PLACA -->
                    <div class="mb-3">
                        <label for="placaVeiculo" class="form-label fw-semibold">
                            Placa
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="placaVeiculo"
                            name="placaVeiculo"
                            placeholder="ABC-1234"
                            maxlength="8"
                            required
                        >
                    </div>

                    <!-- BOTÕES -->
                    <button type="submit" class="btn btn-primary" id="btnCadastrarVeiculo">
                        Cadastrar veículo
                    </button>
                    <button type="reset" class="btn btn-danger" id="btnLimparVeiculo">
                        Limpar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div
        class="modal fade"
        id="modalCadastroVeiculo"
        tabindex="-1"
        aria-labelledby="modalCadastroVeiculoLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCadastroVeiculoLabel">
                        Cadastrar Veículo
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                        id="btnFecharModalVeiculo"
                    ></button>
                </div>
                <div class="modal-body">
                    <p>
                        Preencha os dados do veículo no formulário.
                    </p>
                </div>
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        id="btnFecharCadastroVeiculo"
                    >
                        Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYJYlzcLA8Nl-+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>
</body>

</html>
