<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParkReserva</title>
    <!-- CSS próprio -->
    <link rel="stylesheet" href="loguin.css">
    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>
    <!-- CONTAINER PRINCIPAL -->
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <!-- CAIXA DE LOGIN -->
        <div
            class="login-box p-5 shadow rounded w-100 bg-white bg-opacity-75"
            style="max-width: 450px;"
        >
            <!-- TÍTULO -->
            <h3 class="text-center fw-bold mb-4" id="tituloLogin">
                Acessar Conta
            </h3>

            <!-- FORMULÁRIO -->
            <form id="formLogin">
                <!-- E-MAIL -->
                <div class="mb-3">
                    <label for="emailLogin" class="form-label fw-semibold">
                        E-mail do Usuário
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-circle-user"></i>
                        </span>
                        <input
                            type="email"
                            class="form-control"
                            id="emailLogin"
                            name="emailLogin"
                            placeholder="nome@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- SENHA -->
                <div class="mb-3">
                    <label for="senhaLogin" class="form-label fw-semibold">
                        Senha
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control"
                            id="senhaLogin"
                            name="senhaLogin"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <span class="input-group-text">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>

                <!-- LEMBRAR / ESQUECI SENHA -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="lembrarSenha"
                            name="lembrarSenha"
                        >
                        <label class="form-check-label" for="lembrarSenha">
                            Lembrar senha
                        </label>
                    </div>
                    <a href="recuperar.html" class="text-decoration-none" id="linkRecuperarSenha">
                        Esqueci a senha
                    </a>
                </div>

                <!-- BOTÃO ENTRAR -->
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnEntrar">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Entrar
                    </button>
                </div>

                <!-- CADASTRO -->
                <div class="text-center mt-3">
                    <a href="cadastrofuncionario.html" class="text-decoration-none" id="linkCadastro">
                        <i class="fa-solid fa-user-plus me-1"></i>
                        Não tem uma conta? Cadastre-se
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
