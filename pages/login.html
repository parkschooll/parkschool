<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

        <div class="login-box p-5 shadow rounded w-100 bg-white" style="max-width: 450px;">

            <h3 class="text-center fw-bold mb-4">
                Acessar Conta
            </h3>

            <form>

                <div class="mb-3">
                    <label for="usuario-login" class="form-label">
                        Usuário
                    </label>

                    <input type="text" id="usuario-login" name="usuario-login" class="form-control" required>
                </div>


                <div class="mb-3">
                    <label for="senha-login" class="form-label">
                        Senha
                    </label>

                    <input type="password" id="senha-login" name="senha-login" class="form-control" required>
                </div>


                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lembrar-senha">

                        <label class="form-check-label" for="lembrar-senha">
                            Lembrar senha
                        </label>
                    </div>

                    <a href="esqueceu-senha.html" class="text-decoration-none">
                        Esqueceu a senha?
                    </a>

                </div>


                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Entrar
                    </button>
                </div>


            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
