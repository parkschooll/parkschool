<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHOLLPARK - Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
    <div class="navbar navbar-expand-lg w-100 m-0 p-0 navbar-seguranca">
        <div class="container-fluid d-flex justify-content-center align-items-center p-2 mt-2 ms-2 me-2">
            <a class="navbar-brand text-white fs-3" href="#">SCHOLLPARK</a>
            <span class="text-white position-absolute top-0 end-0 me-3 fs-5 mt-4">Bem-vindo, Segurança!</span>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">
        <!-- 1. TELA DE VAGAS -->
        <div id="conteudoVagas" class="formulario">
            <h2 class="titulo-formulario d-flex justify-content-center gap-2 fs-1">
                Vagas
            </h2>
            <div id="containerVagas" class="container-cards d-flex flex-wrap gap-3 justify-content-center">
                <!-- As vagas serão geradas dinamicamente via JS -->
            </div>
        </div>

        <div id="conteudoCadastro" class="formulario d-none">
            <h2 class="titulo-formulario">Cadastro</h2>
            <form id="formCadastro" class="row g-3">
                <div class="col-12">
                    <h4 class="titulo-secao">Dados do Funcionário</h4>
                </div>
                <div class="col-md-8">
                    <label for="nome" class="form-label"> Nome completo </label>
                    <input type="text" class="form-control" id="nome" required placeholder="Digite o nome completo" />
                </div>
                <div class="col-md-4">
                    <label for="telefone" class="form-label"> Telefone </label>
                    <input type="tel" class="form-control" id="telefone" required placeholder="(12) 99999-9999" />
                </div>

                <div class="col-md-6">
                    <label for="identificacaofuncionario" class="form-label"> Identificação do Funcionário </label>
                    <input type="text" class="form-control" id="identificacaofuncionario" required placeholder="Ex: 012345" />
                </div>

                <div class="col-12">
                    <h4 class="titulo-secao">Dados do Veículo</h4>
                </div>
                <div class="col-md-4">
                    <label for="tipoVeiculo" class="form-label"> Tipo de veículo </label>
                    <select id="tipoVeiculo" class="form-select" required>
                        <option value="" selected disabled>Selecione</option>
                        <option value="Carro">Carro</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="modelo" class="form-label"> Modelo </label>
                    <input type="text" class="form-control" id="modelo" required placeholder="Ex: Honda Civic" />
                </div>
                <div class="col-md-4">
                    <label for="cor" class="form-label"> Cor </label>
                    <input type="text" class="form-control" id="cor" required placeholder="Ex: Preto" />
                </div>
                <div class="col-md-6">
                    <label for="ano" class="form-label"> Ano </label>
                    <input type="number" class="form-control" id="ano" min="1900" max="2100" required placeholder="Ex: 2022" />
                </div>
                <div class="col-md-6">
                    <label for="placa" class="form-label"> Placa </label>
                    <input type="text" class="form-control text-uppercase" id="placa" maxlength="7" required placeholder="ABC1D23" />
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary btn-cadastrar">Cadastrar</button>
                    <button type="reset" class="btn btn-secondary btn-cadastrar ms-2">Limpar</button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/telaSeguranca.js"></script>
</body>
</html>
