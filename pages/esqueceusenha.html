<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="login-box p-5 shadow rounded w-100 bg-white" style="max-width: 450px;">
            <h3 class="text-center fw-bold mb-4">Recuperar Senha</h3>

            <form method="post" action="#">
                <p class="mb-3">Digite o e-mail associado à sua conta. Enviaremos instruções para redefinir a senha.</p>

                <div class="mb-3">
                    <label for="email-recuperacao" class="form-label">E-mail</label>
                    <input type="email" id="email-recuperacao" name="email" class="form-control" placeholder="seu@exemplo.com" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Enviar instruções</button>
                </div>

                <div class="text-center mt-3">
                    <a href="login.html" class="text-decoration-none">Voltar ao login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
